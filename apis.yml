aid: clad-labs
name: Clad Labs
description: >-
  Clad Labs is a San Francisco developer-tools startup (Y Combinator, Fall 2025)
  building Chad IDE, a desktop development environment that orchestrates multiple
  AI coding agents — Claude Code, Cursor CLI, and OpenAI Codex — from a single
  interface. Developers spin up teams of parallel agents, keep each task isolated
  in its own workspace, then merge clean changes back together, while a built-in
  analytics dashboard tracks coding habits and productivity metrics. The IDE also
  fills AI-inference downtime with an in-app "Chad Browser" for entertainment that
  automatically hands focus back to the code when generation completes. Clad Labs
  ships a downloadable macOS and Windows application rather than a public web API;
  it exposes no REST/OpenAPI developer surface at this time.
